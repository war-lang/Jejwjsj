<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>discord.gg</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: #0f172a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; padding: 20px; } .card { width: 100%; max-width: 500px; background: #1e293b; padding: 35px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); } h1 { margin-top: 0; font-size: 30px; } p { color: #94a3b8; } button { width: 100%; padding: 16px; margin-top: 20px; border: 0; border-radius: 10px; background: #3b82f6; color: white; font-size: 17px; font-weight: bold; cursor: pointer; } button:hover { background: #2563eb; } #result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 12px; text-align: left; line-height: 2; display: none; } .label { color: #94a3b8; } .value { font-weight: bold; } .map { display: block; margin-top: 18px; text-align: center; color: #60a5fa; text-decoration: none; } </style> </head> <body> <div class="card"> <h1>📍 My Location</h1> <p> would you like to enter this site. </p> <button onclick="getLocation()"> enter website</button> <div id="result"></div> </div> <script> function getLocation() { const result = document.getElementById("result"); if (!navigator.geolocation) { result.style.display = "block"; result.innerHTML = "❌ Geolocation is not supported by this browser."; return; } result.style.display = "block"; result.innerHTML = "📡 Requesting your location..."; navigator.geolocation.getCurrentPosition( function(position) { const latitude = position.coords.latitude; const longitude = position.coords.longitude; const accuracy = position.coords.accuracy; const mapsURL = "https://www.google.com/maps/search/?api=1&query=" + latitude + "," + longitude; result.innerHTML = "<span class='label'>Latitude:</span> " + "<span class='value'>" + latitude + "</span><br>" + "<span class='label'>Longitude:</span> " + "<span class='value'>" + longitude + "</span><br>" + "<span class='label'>Accuracy:</span> " + "<span class='value'>" + Math.round(accuracy) + " meters</span>" + "<a class='map' href='" + mapsURL + "' target='_blank'>Open Location in Google Maps →</a>"; }, function(error) { result.style.display = "block"; if (error.code === 1) { result.innerHTML = "❌ Location permission was denied."; } else if (error.code === 2) { result.innerHTML = "❌ Your location could not be determined."; } else { result.innerHTML = "❌ Location request timed out."; } }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } ); } </script> </body> </html>
